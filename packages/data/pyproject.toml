[project]
name = "tilik-data"
version = "0.1.0"
description = "TilikKlaim synthetic corpus generator, risk injectors, splits, and leakage controls"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "tilik-domain", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilik_data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
tilik-domain = { path = "../domain", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
