[project]
name = "tilik-model"
version = "0.1.0"
description = "TilikKlaim similarity and anomaly baselines, band calibration, and the model card"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "tilik-domain",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "tilik-data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilik_model"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
tilik-domain = { path = "../domain", editable = true }
tilik-data = { path = "../data", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
