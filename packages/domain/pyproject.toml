[project]
name = "tilik-domain"
version = "0.1.0"
description = "TilikKlaim canonical model, reason catalog, and evidence edges"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilik_domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
